[project]
name = "excel-mcp-server-2013"
version = "1.0.0"
description = "MCP server for Excel automation via COM. Dev on Office 2021, target Excel 2013."
requires-python = ">=3.11"
dependencies = [
    # NOTA: el entorno tiene fastmcp 3.4.3 instalado; el codigo usa la API 3.x
    # (lifespan como async context manager, instructions=). No bajar a 2.x.
    "fastmcp>=3.0.0,<4.0.0",
    "pywin32>=306",
    "psutil>=5.9.0",
    "typer>=0.16.0",
]

[project.scripts]
excel-mcp-2013 = "excel_mcp_2013.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_mcp_2013"]
